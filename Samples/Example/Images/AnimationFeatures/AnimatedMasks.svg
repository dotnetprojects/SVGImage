<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="ink"><stop stop-color="#5265eb"/><stop offset="1" stop-color="#16a994"/></linearGradient>
    <mask id="spot" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="90">
      <circle cx="50" cy="45" r="43" fill="black">
        <animate attributeName="cx" values="50;250;50" dur="4s" repeatCount="indefinite"/>
      </circle>
    </mask>
    <mask id="shade" maskUnits="userSpaceOnUse" x="0" y="110" width="300" height="90">
      <rect y="110" width="300" height="90" fill="white"/>
      <circle cx="50" cy="155" r="43" fill="#800000">
        <animate attributeName="cx" values="50;250;50" dur="4s" repeatCount="indefinite"/>
      </circle>
    </mask>
  </defs>
  <rect width="300" height="90" rx="14" fill="url(#ink)" mask="url(#spot)"/>
  <rect y="110" width="300" height="90" rx="14" fill="url(#ink)" mask="url(#shade)"/>
</svg>
