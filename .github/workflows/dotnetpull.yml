name: Pull request build

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build all target frameworks
        run: dotnet build Source/SVGImage/DotNetProjects.SVGImage.csproj --configuration Release -p:GeneratePackageOnBuild=false
      - name: Build the example application
        run: dotnet build Samples/Example/Example.csproj --configuration Release -p:TargetFrameworks=net8.0-windows -p:GeneratePackageOnBuild=false
      - name: Validate release version parsing
        run: ./Tests/ReleaseWorkflowTests.ps1
      - name: Run regression checks
        run: dotnet run --project Tests/RegressionTests --configuration Release -p:TargetFrameworks=net8.0-windows -p:GeneratePackageOnBuild=false
